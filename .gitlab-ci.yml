# GitLab CI/CD —— 按项目文件特征自动触发对应 pipeline 模板。
# 和 system-requirement-flow / rvc-frontend 用的是同一套 radio-verification-cloud 模板。
#
# python pipeline 的触发条件是存在 main.py。pim-analysis 当前以 api.py 为服务入口,
# 没有 main.py,所以暂时不会命中 python 规则 —— 要启用 CI 时,加一个薄薄的
# main.py 转发到 uvicorn(或改 rules.exists 为 api.py)即可。
include:
  - project: 'radio-verification-cloud/gitlab-templates'
    ref: 'main'
    file: 'gitlab-ci/pipelines/python.yml'
    rules:
      - exists:
          - main.py
          - api.py
