[project]
name = "pim-analysis"
version = "1.0.0"
description = "实时查询 MI/RTD 的 PIM Web 服务，支持 Windows SSPI 与 Linux Kerberos"
requires-python = ">=3.10"

# 核心计算模块（yield_calc.py / structure.py / data_source.py）只用标准库，
# 所以这里是空的。各场景按需装下面的 extras。
dependencies = []

[project.optional-dependencies]

# ── Web/API 基础依赖；Linux 实时取数请使用 linux extra ──
server = [
    "requests>=2.32.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # 解析登录表单的 POST 数据，FastAPI 的 Form() 需要它
    "python-multipart>=0.0.9",
]

# Linux 实时取数；使用系统 Kerberos ticket cache（先执行 kinit）。
linux = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.3",
    "requests-gssapi>=1.3.0 ; sys_platform == 'linux'",
]

# ── Windows 端：拉 MI 数据 ──
# requests-negotiate-sspi 只能在 Windows 域内用（Kerberos 集成认证），
# 加平台标记免得在 Linux 上装不上导致整个 sync 失败。
fetch = [
    "requests>=2.32.3",
    "requests-negotiate-sspi>=0.5.2 ; sys_platform == 'win32'",
]

# ── 出图与表格（旧的 Streamlit 界面和 analyze.py 需要）──
viz = [
    "matplotlib>=3.9.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "streamlit>=1.39.0",
]

# ── RTD 凭据维护 ──
# RTD（实时测试数据）走 Cloudflare Access，命令行拿不到凭据，只能起一个
# 真浏览器登录一次再把 Cookie 抓出来，所以要 playwright。
# Windows 默认复用系统 Chrome/Edge；Linux 默认使用 Playwright Chromium。
# MI 那条路走 Kerberos 不需要浏览器，所以单独分一组。
rtd = [
    "playwright>=1.47",
    "requests>=2.32.3",
]

# ── 开发与测试 ──
dev = [
    "pytest>=8.3.3",
    "openpyxl>=3.1.5",          # 只有 extract_serials.py 读 Excel 要用
    "httpx>=0.27.2",            # FastAPI 的 TestClient 依赖它
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.9",  # 登录表单
    "requests>=2.32.3",
    "requests-negotiate-sspi>=0.5.2 ; sys_platform == 'win32'",
    "matplotlib>=3.9.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "playwright>=1.47",         # refresh_cookies.py 和界面上的刷新按钮
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
